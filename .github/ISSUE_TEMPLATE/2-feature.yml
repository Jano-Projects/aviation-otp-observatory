name: Feature request
description: An idea to improve the project
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposal
      description: How you would solve it, if you have an idea.
